name: Windows build and tests
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Prepare pinned Python build runtime
        shell: pwsh
        run: ./tools/install-python.ps1
      - name: Build
        shell: pwsh
        run: ./build.ps1
      - name: Tests
        shell: pwsh
        run: ./test.ps1
      - name: Windows DPAPI and file watcher smoke
        shell: pwsh
        run: ./tools/probe-clipboard.ps1
      - name: Freeze translator
        shell: pwsh
        run: ./tools/build-worker.ps1
      - name: Worker protocol tests
        shell: pwsh
        run: ./test.ps1 -PythonTests
      - name: Prepare pinned Inno Setup
        shell: pwsh
        run: ./tools/install-inno.ps1
      - name: Package
        shell: pwsh
        run: ./publish.ps1 -SkipWorkerBuild
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cyclop-Windows-x64
          path: |
            artifacts/*.zip
            artifacts/*Setup.exe
            artifacts/SHA256SUMS.txt
            artifacts/test-results/**
